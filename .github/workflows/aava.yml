name: Test AAVA Action

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AAVA Action
        uses: Rishikesh2919/aava-github-action@main
        with:
          workflow-id: "15654"
          realm-id: "185"
          inputs: |
            {
              "brd": "Testing GitHub Action"
            }
          token: ${{ secrets.AAVA_TOKEN }}